# 게이트웨이 (외주작업지시서 2-1: nginx(Gateway) → nestjs(App) → postgres(DB))
#
# 바깥에서 들어오는 유일한 문입니다. API 컨테이너는 호스트에 포트를 열지 않고,
# 이 nginx 를 거쳐서만 닿습니다.
#
# 주소 두 개를 받습니다 (`.env` 에서 지정, 컨테이너가 뜰 때 치환됩니다).
#   ${SERVER_NAME}        앱이 붙는 API        예) api.ramuviamanager.com
#   ${ADMIN_SERVER_NAME}  관리자 웹            예) ramuviamanager.com
#
# **왜 나누는가**: 관리자 화면은 남의 실시간 위치가 보입니다. 주소를 나눠 두면
# 관리자 쪽만 IP 로 막을 수 있고, 2단계에서 서버를 분리할 때도 그대로 떼어집니다
# (지시서 3-1: 관리자 웹은 IP 화이트리스트로 제한).

upstream api {
  # 도커 네트워크 안의 서비스 이름. 바깥에서는 이 주소로 못 옵니다
  server api:3000;
  keepalive 32;
}

# 인증서를 받기 전/HTTP 로 들어온 요청은 HTTPS 로 보냅니다
server {
  listen 80;
  server_name ${SERVER_NAME} ${ADMIN_SERVER_NAME};

  # Let's Encrypt 가 소유 확인을 하러 오는 길만 열어 둡니다
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${SERVER_NAME};

  ssl_certificate     /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # 어떤 서버·버전인지 알려 주지 않습니다 (공격 대상을 좁혀 주는 정보입니다)
  server_tokens off;

  # 사진·동영상 업로드와 위치 묶음 전송 때문에 넉넉히 잡습니다.
  # **기본값은 1MB 라서, 그대로 두면 큰 묶음이 413 으로 튕깁니다**
  client_max_body_size 50m;
  client_body_timeout 60s;

  gzip on;
  gzip_types application/json text/plain text/css application/javascript;
  gzip_min_length 1024;

  # 실시간(WebSocket). 채팅과 친구 위치가 이 길로 옵니다
  location /ws {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 조용해도 끊지 않습니다. 끊기면 위치가 실시간으로 안 옵니다
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # 관리자 화면은 이 주소에서 열지 않습니다 (아래 관리자 전용 블록에서만)
  location /admin {
    return 404;
  }

  location / {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

# 관리자 웹 (지시서 3-1: 접근은 IP 화이트리스트로 제한).
# **남의 실시간 위치가 보이는 화면이라 아무나 열면 안 됩니다.**
server {
  listen 443 ssl;
  http2 on;
  server_name ${ADMIN_SERVER_NAME};

  ssl_certificate     /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;

  # 회사 고정 IP 를 적고 주석을 푸세요.
  # 풀기 전까지는 **관리자 비밀번호만으로** 막혀 있습니다 — 고정 IP 가 정해지면 꼭 켜세요
  # allow 203.0.113.10;
  # deny all;

  location / {
    proxy_pass http://api/admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
