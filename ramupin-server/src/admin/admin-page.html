<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>라무핀 관리자</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --line: #e3e6ea;
        --text: #1c1f23;
        --dim: #6b7280;
        --blue: #0095ff;
        --red: #d92d20;
        --green: #067647;
        --warn-bg: #fff8e6;
        --warn-line: #f0c454;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.55 'Malgun Gothic',
          -apple-system,
          system-ui,
          sans-serif;
      }
      header {
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        padding: 14px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      header h1 {
        font-size: 17px;
        margin: 0;
      }
      header .who {
        margin-left: auto;
        color: var(--dim);
        font-size: 13px;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 18px;
      }
      .tabs button {
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        padding: 8px 14px;
        font-size: 15px;
        cursor: pointer;
        color: var(--dim);
      }
      .tabs button.on {
        color: var(--text);
        border-bottom-color: var(--blue);
        font-weight: 600;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 18px;
      }
      .panel h2 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      .panel .sub {
        color: var(--dim);
        font-size: 13px;
        margin-bottom: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
        vertical-align: top;
      }
      th {
        color: var(--dim);
        font-weight: 600;
        font-size: 13px;
      }
      td.label {
        width: 34%;
      }
      td.label .help {
        display: block;
        color: var(--dim);
        font-size: 12px;
        margin-top: 3px;
      }
      input[type='number'],
      input[type='text'],
      input[type='password'],
      select {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 7px 9px;
        font-size: 14px;
        width: 130px;
        background: #fff;
        color: inherit;
      }
      input[type='text'],
      input[type='password'] {
        width: 240px;
      }
      .unit {
        color: var(--dim);
        font-size: 13px;
        margin-left: 6px;
      }
      .changed input,
      .changed select {
        border-color: var(--blue);
        background: #f0f8ff;
      }
      button.action {
        background: var(--blue);
        color: #fff;
        border: 0;
        border-radius: 7px;
        padding: 9px 18px;
        font-size: 14px;
        cursor: pointer;
      }
      button.action:disabled {
        background: #c7cdd4;
        cursor: default;
      }
      button.ghost {
        background: none;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 8px 14px;
        cursor: pointer;
        font-size: 14px;
        color: inherit;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .note {
        background: var(--warn-bg);
        border: 1px solid var(--warn-line);
        border-radius: 8px;
        padding: 11px 14px;
        font-size: 13px;
        margin-bottom: 16px;
      }
      .msg {
        font-size: 13px;
      }
      .msg.ok {
        color: var(--green);
      }
      .msg.err {
        color: var(--red);
      }
      .est {
        font-size: 13px;
        color: var(--dim);
        margin-top: 10px;
      }
      .est b {
        color: var(--text);
      }
      #login {
        max-width: 340px;
        margin: 80px auto;
      }
      #login label {
        display: block;
        font-size: 13px;
        color: var(--dim);
        margin: 12px 0 4px;
      }
      #login input {
        width: 100%;
      }
      #login button {
        width: 100%;
        margin-top: 18px;
      }
      .hidden {
        display: none !important;
      }
      code {
        background: #f1f3f5;
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <!-- 로그인 -->
    <div id="login" class="panel">
      <h2>라무핀 관리자</h2>
      <div class="sub">관리자 계정으로 로그인하세요.</div>
      <label for="loginId">아이디</label>
      <input id="loginId" type="text" autocomplete="username" />
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button class="action" id="loginBtn">로그인</button>
      <div class="msg err" id="loginMsg" style="margin-top: 12px"></div>
    </div>

    <!-- 본 화면 -->
    <div id="app" class="hidden">
      <header>
        <h1>라무핀 관리자</h1>
        <div class="tabs">
          <button data-tab="plans" class="on">등급별 설정</button>
          <button data-tab="user">사용자별 예외</button>
          <button data-tab="audit">변경 이력</button>
        </div>
        <div class="who"><span id="who"></span> <button class="ghost" id="logoutBtn">로그아웃</button></div>
      </header>
      <main>
        <section id="tab-plans">
          <div class="note">
            <b>수집 주기를 바꾸면 전국 모든 기기에 적용됩니다.</b> 짧게 할수록 배터리와 서버 비용이 함께 올라갑니다. 앱을 다시 배포할 필요는
            없고, 각 기기가 다음 정책 갱신 때 새 값을 받습니다.
          </div>
          <div class="row" style="margin-bottom: 14px">
            <label for="planSel" style="color: var(--dim); font-size: 13px">등급</label>
            <select id="planSel" style="width: 180px"></select>
            <span class="msg" id="planUpdated" style="color: var(--dim)"></span>
          </div>
          <div id="planGroups"></div>
          <div class="row">
            <button class="action" id="savePlan" disabled>저장</button>
            <button class="ghost" id="resetPlan">되돌리기</button>
            <span class="msg" id="planMsg"></span>
          </div>
        </section>

        <section id="tab-user" class="hidden">
          <div class="panel">
            <h2>사용자별 예외</h2>
            <div class="sub">
              한 사람만 등급과 다르게 둘 때 씁니다. 여기서 정한 값이 등급 설정보다 우선합니다. 비워 두면 등급 기본값을 따릅니다.
            </div>
            <div class="row">
              <input id="publicId" type="text" placeholder="사용자 ID 8자리" maxlength="8" style="width: 160px" />
              <button class="ghost" id="findUser">찾기</button>
              <span class="msg" id="userMsg"></span>
            </div>
          </div>
          <div id="userPanel" class="hidden">
            <div class="panel">
              <h2 id="userTitle"></h2>
              <div class="sub" id="userSub"></div>
              <div id="userGroups"></div>
              <div class="row">
                <button class="action" id="saveUser">저장</button>
                <button class="ghost" id="clearUser">예외 삭제 (등급 기본값으로)</button>
                <span class="msg" id="userSaveMsg"></span>
              </div>
            </div>
          </div>
        </section>

        <section id="tab-audit" class="hidden">
          <div class="panel">
            <h2>변경 이력</h2>
            <div class="sub">누가 언제 무엇을 바꿨는지 남습니다.</div>
            <table>
              <thead>
                <tr>
                  <th style="width: 150px">시각</th>
                  <th style="width: 110px">관리자</th>
                  <th style="width: 150px">대상</th>
                  <th>바뀐 값</th>
                </tr>
              </thead>
              <tbody id="auditBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script>
      const API = '/admin/api';
      const PLAN_NAMES = { basic: '베이직', platinum: '플래티넘', trinity: '트리니티', care: '케어', guardian: '가디언' };

      let fields = [];
      let role = 'viewer';
      let plans = [];
      let currentPlan = null;
      let currentUser = null;

      const $ = (id) => document.getElementById(id);

      /** Enter 로 실행. 다른 키는 건드리지 않습니다 */
      function onEnter(input, run) {
        input.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter') return;
          event.preventDefault();
          run();
        });
      }

      async function api(path, options) {
        const res = await fetch(API + path, {
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          ...options,
        });
        const text = await res.text();
        const body = text ? JSON.parse(text) : null;
        if (!res.ok) throw new Error(body?.message || '요청에 실패했습니다');
        return body;
      }

      // ── 로그인 ───────────────────────────────────────────
      $('loginBtn').onclick = async () => {
        $('loginMsg').textContent = '';
        try {
          await api('/login', {
            method: 'POST',
            body: JSON.stringify({ loginId: $('loginId').value, password: $('password').value }),
          });
          await start();
        } catch (error) {
          $('loginMsg').textContent = error.message;
        }
      };
      // 화살표 함수가 false 를 돌려주면 브라우저가 그 키 입력을 취소합니다.
      // `e.key === 'Enter' && ...` 는 다른 키에서 false 가 되어 글자가 아예 안 들어갔습니다 (09-18 수정).
      onEnter($('loginId'), () => $('loginBtn').click());
      onEnter($('password'), () => $('loginBtn').click());

      $('logoutBtn').onclick = async () => {
        await api('/logout', { method: 'POST' });
        location.reload();
      };

      async function start() {
        const me = await api('/me');
        fields = me.fields;
        role = me.role;
        $('who').textContent = me.name + (role === 'viewer' ? ' (보기 전용)' : '');
        $('login').classList.add('hidden');
        $('app').classList.remove('hidden');
        plans = await api('/plans');
        $('planSel').innerHTML = plans.map((p) => `<option value="${p.plan}">${PLAN_NAMES[p.plan] || p.plan}</option>`).join('');
        selectPlan(plans[0].plan);
      }

      // ── 탭 ──────────────────────────────────────────────
      document.querySelectorAll('.tabs button').forEach((btn) => {
        btn.onclick = async () => {
          document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b === btn));
          for (const name of ['plans', 'user', 'audit']) {
            $('tab-' + name).classList.toggle('hidden', name !== btn.dataset.tab);
          }
          if (btn.dataset.tab === 'audit') await loadAudit();
        };
      });

      // ── 항목 그리기 ──────────────────────────────────────
      /** 'features.premiumMap' 같은 점 표기로 값 꺼내기 */
      function pick(source, key) {
        return key.split('.').reduce((acc, part) => (acc == null ? undefined : acc[part]), source);
      }

      function renderGroups(container, policy, inherited) {
        const groups = [...new Set(fields.map((f) => f.group))];
        container.innerHTML = groups
          .map(
            (group) => `
          <div class="panel">
            <h2>${group}</h2>
            <table><tbody>
              ${fields
                .filter((f) => f.group === group)
                .map((f) => row(f, pick(policy, f.key), inherited ? pick(inherited, f.key) : undefined))
                .join('')}
            </tbody></table>
            ${group === '위치 수집' ? '<div class="est" id="est-' + container.id + '"></div>' : ''}
          </div>`,
          )
          .join('');

        container.querySelectorAll('[data-key]').forEach((input) => {
          input.disabled = role === 'viewer';
          input.oninput = () => {
            input.closest('tr').classList.add('changed');
            if (container.id === 'planGroups') $('savePlan').disabled = false;
            updateEstimate(container);
          };
        });
        updateEstimate(container);
      }

      function row(field, value, inheritedValue) {
        const has = value !== undefined && value !== null;
        const shown = has ? value : (inheritedValue ?? '');
        const placeholder = !has && inheritedValue !== undefined ? `등급 기본값 ${inheritedValue}` : '';
        let control;
        if (field.type === 'switch') {
          control = `<select data-key="${field.key}"><option value="">${placeholder || '-'}</option><option value="true" ${shown === true ? 'selected' : ''}>사용</option><option value="false" ${shown === false ? 'selected' : ''}>사용 안 함</option></select>`;
        } else if (field.type === 'choice') {
          control = `<select data-key="${field.key}"><option value="">${placeholder || '-'}</option>${field.choices
            .map((c) => `<option value="${c.value}" ${shown === c.value ? 'selected' : ''}>${c.label}</option>`)
            .join('')}</select>`;
        } else {
          const unit = field.type === 'seconds' ? '초' : field.type === 'megabytes' ? 'MB' : '개';
          control = `<input type="number" data-key="${field.key}" value="${has ? value : ''}" placeholder="${placeholder}" min="${field.min ?? 0}" max="${field.max ?? ''}" /><span class="unit">${unit}</span>`;
        }
        return `<tr><td class="label">${field.label}${field.help ? `<span class="help">${field.help}</span>` : ''}</td><td>${control}</td></tr>`;
      }

      /** 지금 값으로 하루에 몇 건이 쌓이는지 바로 보여 줍니다 */
      function updateEstimate(container) {
        const box = container.querySelector('[id^="est-"]');
        if (!box) return;
        const get = (key) => Number(container.querySelector(`[data-key="${key}"]`)?.value || 0);
        const moving = get('gpsIntervalMovingSec');
        const still = get('gpsIntervalStillSec');
        const upload = get('uploadIntervalSec');
        if (!moving || !still || !upload) {
          box.textContent = '';
          return;
        }
        // 하루 중 이동 2시간 / 머무름 22시간 기준 (docs/server-cost-estimate.md 전제와 같음)
        const perDay = Math.round((2 * 3600) / moving + (22 * 3600) / still);
        const requests = Math.round(86400 / upload);
        box.innerHTML = `이 설정이면 기기 1대가 하루에 <b>${perDay.toLocaleString()}건</b>을 모으고 <b>${requests.toLocaleString()}번</b> 전송합니다. 10만 대 기준 하루 <b>${((perDay * 100000) / 100000000).toFixed(2)}억 건</b>. <span style="color:var(--dim)">(이동 2시간 / 머무름 22시간 가정)</span>`;
      }

      function collect(container) {
        const patch = {};
        container.querySelectorAll('[data-key]').forEach((input) => {
          const field = fields.find((f) => f.key === input.dataset.key);
          const raw = input.value;
          if (raw === '') return;
          if (field.type === 'switch') patch[field.key] = raw === 'true';
          else if (field.type === 'choice') patch[field.key] = raw;
          else patch[field.key] = Number(raw);
        });
        return patch;
      }

      // ── 등급 ────────────────────────────────────────────
      $('planSel').onchange = () => selectPlan($('planSel').value);
      $('resetPlan').onclick = () => selectPlan(currentPlan.plan);

      function selectPlan(plan) {
        currentPlan = plans.find((p) => p.plan === plan);
        $('planSel').value = plan;
        $('planUpdated').textContent = '마지막 수정: ' + new Date(currentPlan.updatedAt).toLocaleString('ko-KR');
        $('planMsg').textContent = '';
        $('savePlan').disabled = true;
        renderGroups($('planGroups'), currentPlan.policy, null);
      }

      $('savePlan').onclick = async () => {
        $('planMsg').textContent = '';
        const patch = collect($('planGroups'));
        const seconds = ['gpsIntervalMovingSec', 'gpsIntervalStillSec'];
        if (seconds.some((k) => patch[k] <= 20) && !confirm('20초 이하로 자주 확인하면 배터리와 서버 비용이 크게 올라갑니다. 계속할까요?')) return;
        try {
          const saved = await api('/plans/' + currentPlan.plan, { method: 'PUT', body: JSON.stringify(patch) });
          currentPlan.policy = saved.policy;
          currentPlan.updatedAt = new Date().toISOString();
          selectPlan(currentPlan.plan);
          $('planMsg').className = 'msg ok';
          $('planMsg').textContent = '저장했습니다.';
        } catch (error) {
          $('planMsg').className = 'msg err';
          $('planMsg').textContent = error.message;
        }
      };

      // ── 사용자별 ────────────────────────────────────────
      $('findUser').onclick = async () => {
        $('userMsg').textContent = '';
        $('userPanel').classList.add('hidden');
        try {
          currentUser = await api('/users/' + $('publicId').value.trim());
          const plan = plans.find((p) => p.plan === currentUser.plan);
          $('userTitle').textContent = `${currentUser.nickname} (${currentUser.publicId})`;
          $('userSub').textContent = `등급: ${PLAN_NAMES[currentUser.plan] || currentUser.plan} · 비워 두면 등급 기본값을 따릅니다`;
          renderGroups($('userGroups'), currentUser.override || {}, plan ? plan.policy : {});
          $('userSaveMsg').textContent = '';
          $('userPanel').classList.remove('hidden');
        } catch (error) {
          $('userMsg').className = 'msg err';
          $('userMsg').textContent = error.message;
        }
      };
      onEnter($('publicId'), () => $('findUser').click());

      $('saveUser').onclick = async () => {
        try {
          await api('/users/' + currentUser.publicId, { method: 'PUT', body: JSON.stringify(collect($('userGroups'))) });
          $('userSaveMsg').className = 'msg ok';
          $('userSaveMsg').textContent = '저장했습니다.';
          await $('findUser').onclick();
        } catch (error) {
          $('userSaveMsg').className = 'msg err';
          $('userSaveMsg').textContent = error.message;
        }
      };

      $('clearUser').onclick = async () => {
        if (!confirm('이 사용자의 예외를 지우고 등급 기본값으로 되돌릴까요?')) return;
        await api('/users/' + currentUser.publicId, { method: 'DELETE' });
        await $('findUser').onclick();
      };

      // ── 이력 ────────────────────────────────────────────
      async function loadAudit() {
        const rows = await api('/audit');
        const label = (key) => fields.find((f) => f.key === key)?.label || key;
        $('auditBody').innerHTML = rows.length
          ? rows
              .map(
                (r) => `<tr>
                  <td>${new Date(r.createdAt).toLocaleString('ko-KR')}</td>
                  <td>${r.adminName}</td>
                  <td>${r.scope === 'plan' ? (PLAN_NAMES[r.target] || r.target) + ' 등급' : '사용자 ' + r.target}</td>
                  <td>${r.changes.map((c) => `${label(c.key)}: <code>${c.before ?? '-'}</code> → <code>${c.after ?? '-'}</code>`).join('<br>')}</td>
                </tr>`,
              )
              .join('')
          : '<tr><td colspan="4" style="color:var(--dim)">아직 변경 기록이 없습니다.</td></tr>';
      }

      // 이미 로그인돼 있으면 바로 화면으로
      start().catch(() => {
        $('login').classList.remove('hidden');
      });
    </script>
  </body>
</html>
